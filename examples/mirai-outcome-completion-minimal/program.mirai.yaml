contract_version: 1.0.0
id: program.outcome-completion
version: 1.0.0
imports: []
inputs:
  - id: contract
    type: { kind: record, fields: { digest: string } }
    required: true
  - id: candidates
    type: { kind: record, fields: { digest: string } }
    required: true
  - id: evidence
    type: { kind: record, fields: { digest: string } }
    required: true
outputs:
  - id: delivery
    type: { kind: record, fields: { digest: string, status: string } }
    required: true
state:
  - id: assessment
    type: { kind: record, fields: { digest: string, status: string } }
    default: { digest: pending, status: pending }
  - id: delivery
    type: { kind: record, fields: { digest: string, status: string } }
    default: { digest: pending, status: pending }
nodes:
  - id: assess
    kind: call
    target: { kind: adapter, adapter: mirai_outcome, operation: outcome.assess }
    args:
      contract: { op: ref, path: input.contract }
      candidates: { op: ref, path: input.candidates }
      evidence: { op: ref, path: input.evidence }
    result: assessment
    effects: [pure]
    next: plan
  - id: plan
    kind: call
    target: { kind: adapter, adapter: mirai_outcome, operation: outcome.plan_delivery }
    args:
      assessment: { op: ref, path: state.assessment }
    result: delivery
    effects: [pure]
    next: done
  - id: done
    kind: return
    values:
      delivery: { op: ref, path: state.delivery }
entry: assess
error_routes: []
policies:
  budgets: { max_steps: 16, max_depth: 8, max_iterations: 8, max_parallel: 4, max_duration_ms: 30000 }
  allowed_effects: [pure]
  canonical_write_allowed: false
