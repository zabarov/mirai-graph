    path: inputs/graph.json
  - kind: policies
    path: inputs/policies.json
access:
  principal_id: principal.evaluation-reader
  purpose: evaluate_retrieval
  scopes: [scope.federation, scope.larena, scope.ai_employee, scope.organization]
