name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  context-traversal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify deterministic context traversal
        run: node packages/cli/validate-context-traversal.js

      - name: Verify portable project continuity
        run: node packages/cli/validate-project-continuity.js

      - name: Verify local target and provider contracts
        run: npm run test:project-technology

  release-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install release-check dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run release check
        run: npm run release:check
