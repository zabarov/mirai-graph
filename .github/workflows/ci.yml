name: CI

on:
  push:
    branches:
      - main
      - codex/mirai-2.0
      - codex/mirai-2.1
  pull_request:

jobs:
  mirai-program:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Mirai Program packages
        run: npm run build

      - name: Verify Mirai Program contracts
        run: npm run test:mirai-alpha1

      - name: Verify deterministic pure runtime
        run: npm run test:mirai-alpha2

      - name: Verify governed runtime and recovery
        run: npm run test:mirai-alpha3

      - name: Verify Mirai 2.1 graph-native contracts
        run: npm run test:mirai-2.1

      - name: Verify bounded property and security fuzz corpus
        run: npm run test:mirai-property-fuzz

  context-traversal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify deterministic context traversal
        run: node packages/cli/validate-context-traversal.js

      - name: Verify portable project continuity
        run: node packages/cli/validate-project-continuity.js

  clean-room-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install and verify the packed artifact
        run: npm run validate:clean-room-install

  release-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install release-check dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install package dependencies
        run: npm ci

      - name: Run release check
        run: npm run release:check

  readiness-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install package dependencies
        run: npm ci

      - name: Build runtime contracts
        run: npm run build

      - name: Validate production-readiness tiers
        run: npm run validate:production-readiness

      - name: Reject unsafe production-write fixture
        run: npm run test:production-readiness-negative

      - name: Validate contract freeze candidate
        run: npm run validate:contract-freeze-candidate

      - name: Validate honest release status
        run: npm run validate:mirai-release-readiness

      - name: Validate Mirai 2.1 cross-platform CI contract
        run: npm run validate:mirai-2.1-ci-gate
